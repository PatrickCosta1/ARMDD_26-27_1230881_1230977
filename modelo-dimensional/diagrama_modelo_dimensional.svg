<text x="26" y="943" text-anchor="start" font-size="13" font-weight="700" fill="#222">Legenda</text>
<text x="26" y="962" text-anchor="start" font-size="11" fill="#222">PK: chave primária     FK: chave estrangeira     UK: chave única     DD: dimensão degenerada</text>
<text x="26" y="979" text-anchor="start" font-size="11" fill="#222">*: atributo com SCD de tipo 2 (os restantes são de tipo 1)</text>
<text x="26" y="996" text-anchor="start" font-size="11" fill="#222">1 e N: cardinalidade da relação (uma linha da dimensão para N linhas do facto)</text>
<text x="26" y="1013" text-anchor="start" font-size="11" fill="#222">Dim_Data tem dois papéis no facto: data da fatura e data de pagamento</text>
<text x="26" y="1030" text-anchor="start" font-size="11" fill="#222">Dim_Taxa_Cambio tem chave primária composta e é referenciada pelo facto por uma chave estrangeira composta</text>
