<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#444"/></marker>
  </defs>
  <rect width="1100" height="560" fill="#ffffff"/>
  <text x="550" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#222">Arquitetura do armazém de dados — More Rhythm</text>

  <!-- Fonte -->
  <rect x="20" y="70" width="210" height="300" rx="8" fill="#eef3f8" stroke="#2c6fa8" stroke-width="2"/>
  <text x="125" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#1b4f7c">1. Sistema operacional</text>
  <text x="125" y="118" text-anchor="middle" font-size="12" fill="#333">SQL Server · BD MoreRhythm</text>
  <text x="125" y="150" text-anchor="middle" font-size="12" fill="#333">12 tabelas de negócio</text>
  <text x="125" y="172" text-anchor="middle" font-size="12" fill="#333">customers · employees · zones</text>
  <text x="125" y="190" text-anchor="middle" font-size="12" fill="#333">products · families · categories</text>
  <text x="125" y="208" text-anchor="middle" font-size="12" fill="#333">suplliers · invoices</text>
  <text x="125" y="226" text-anchor="middle" font-size="12" fill="#333">invoices_lines · purchases</text>
  <text x="125" y="244" text-anchor="middle" font-size="12" fill="#333">purchases_lines · stocks_movements</text>
  <text x="125" y="286" text-anchor="middle" font-size="11" fill="#555">create_* / last_update_*</text>
  <text x="125" y="302" text-anchor="middle" font-size="11" fill="#555">em cada registo</text>
  <text x="125" y="342" text-anchor="middle" font-size="11" font-style="italic" fill="#555">Só leitura</text>

  <!-- Staging -->
  <rect x="300" y="70" width="270" height="300" rx="8" fill="#fdf4e7" stroke="#c77700" stroke-width="2"/>
  <text x="435" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#8a5200">2. Staging Area</text>
  <text x="435" y="118" text-anchor="middle" font-size="12" fill="#333">BD MoreRhythm_STG</text>
  <rect x="316" y="132" width="238" height="40" rx="5" fill="#fff" stroke="#c77700"/>
  <text x="435" y="150" text-anchor="middle" font-size="12" font-weight="600" fill="#333">stg_raw_rows + stg_&lt;origem&gt;</text>
  <text x="435" y="165" text-anchor="middle" font-size="11" fill="#555">cópia fiel, hash, estado de validação</text>
  <rect x="316" y="180" width="238" height="40" rx="5" fill="#fff" stroke="#c77700"/>
  <text x="435" y="198" text-anchor="middle" font-size="12" font-weight="600" fill="#333">stg_load_control</text>
  <text x="435" y="213" text-anchor="middle" font-size="11" fill="#555">lote, contagens, estado, erros</text>
  <rect x="316" y="228" width="238" height="40" rx="5" fill="#fff" stroke="#b3261e" stroke-width="1.5"/>
  <text x="435" y="246" text-anchor="middle" font-size="12" font-weight="600" fill="#b3261e">stg_rejections</text>
  <text x="435" y="261" text-anchor="middle" font-size="11" fill="#555">registos não corrigíveis, regra e motivo</text>
  <rect x="316" y="276" width="238" height="40" rx="5" fill="#fff" stroke="#c77700"/>
  <text x="435" y="294" text-anchor="middle" font-size="12" font-weight="600" fill="#333">stg_customer_duplicate_groups</text>
  <text x="435" y="309" text-anchor="middle" font-size="11" fill="#555">potenciais duplicados em revisão</text>
  <text x="435" y="346" text-anchor="middle" font-size="11" fill="#555">validação, normalização, frete alocado</text>

  <!-- Data Mart -->
  <rect x="640" y="70" width="270" height="300" rx="8" fill="#eaf6ee" stroke="#2e7d32" stroke-width="2"/>
  <text x="775" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#1f5a23">3. Data Mart</text>
  <text x="775" y="118" text-anchor="middle" font-size="12" fill="#333">BD MoreRhythm_DM · esquema em estrela</text>
  <rect x="656" y="132" width="238" height="52" rx="5" fill="#fff" stroke="#2e7d32"/>
  <text x="775" y="152" text-anchor="middle" font-size="12" font-weight="600" fill="#333">Fact_Vendas</text>
  <text x="775" y="168" text-anchor="middle" font-size="11" fill="#555">1 linha = 1 linha de fatura</text>
  <rect x="656" y="196" width="238" height="86" rx="5" fill="#fff" stroke="#2e7d32"/>
  <text x="775" y="216" text-anchor="middle" font-size="12" font-weight="600" fill="#333">Dimensões</text>
  <text x="775" y="234" text-anchor="middle" font-size="11" fill="#555">Data · Cliente · Produto</text>
  <text x="775" y="250" text-anchor="middle" font-size="11" fill="#555">Fornecedor · Funcionário</text>
  <text x="775" y="266" text-anchor="middle" font-size="11" fill="#555">Moeda · Taxa_Cambio (EUR)</text>
  <text x="775" y="312" text-anchor="middle" font-size="11" fill="#555">SCD tipo 1 e 2 · chaves substitutas</text>
  <text x="775" y="328" text-anchor="middle" font-size="11" fill="#555">valores em moeda original e em EUR</text>

  <!-- Power BI -->
  <rect x="970" y="150" width="110" height="140" rx="8" fill="#f3eefa" stroke="#6a3fa0" stroke-width="2"/>
  <text x="1025" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#4a2a78">4. Análise</text>
  <text x="1025" y="215" text-anchor="middle" font-size="12" fill="#333">Power BI</text>
  <text x="1025" y="240" text-anchor="middle" font-size="11" fill="#555">20 análises</text>
  <text x="1025" y="256" text-anchor="middle" font-size="11" fill="#555">multidimensionais</text>

  <!-- Setas -->
  <line x1="230" y1="220" x2="298" y2="220" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <text x="264" y="208" text-anchor="middle" font-size="11" fill="#333">Extração</text>
  <text x="264" y="240" text-anchor="middle" font-size="10" fill="#555">incremental</text>
  <line x1="570" y1="220" x2="638" y2="220" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <text x="604" y="208" text-anchor="middle" font-size="11" fill="#333">ETL</text>
  <text x="604" y="240" text-anchor="middle" font-size="10" fill="#555">só VALID</text>
  <line x1="910" y1="220" x2="968" y2="220" stroke="#444" stroke-width="2" marker-end="url(#a)"/>

  <!-- SSIS -->
  <rect x="20" y="400" width="890" height="64" rx="8" fill="#f5f5f5" stroke="#777" stroke-dasharray="6 4"/>
  <text x="465" y="424" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Integration Services Project (Visual Studio) — orquestra extração, transformação, limpeza, integração e carregamento</text>
  <text x="465" y="446" text-anchor="middle" font-size="12" fill="#444">Sem caminhos absolutos: servidores e bases de dados (origem, staging, data mart) vêm de um ficheiro de parâmetros</text>

  <!-- Parametros -->
  <rect x="930" y="400" width="150" height="64" rx="8" fill="#fff" stroke="#777"/>
  <text x="1005" y="428" text-anchor="middle" font-size="12" font-weight="600" fill="#333">Ficheiro de</text>
  <text x="1005" y="446" text-anchor="middle" font-size="12" font-weight="600" fill="#333">parâmetros</text>

  <!-- rejeicoes -->
  <path d="M435 370 L435 392" stroke="#b3261e" stroke-width="1.5" fill="none"/>
  <text x="550" y="388" text-anchor="start" font-size="11" fill="#b3261e">Registos rejeitados ficam na Staging (fora do Data Mart)</text>

  <text x="20" y="500" font-size="12" fill="#444">Fluxo: a origem nunca é alterada; cada registo é copiado para a Staging com o lote e o hash, validado (regras R01–R10),</text>
  <text x="20" y="518" font-size="12" fill="#444">e só os registos VALID ou CORRIGIDO seguem para o Data Mart, de forma incremental. Os restantes ficam em stg_rejections.</text>
</svg>
